<div class="event-card">

    <span class="material-symbols-outlined icon">
        {{ event().icon }}
    </span>

    <h2>
        {{ ('events.' + event().id + '.title') | translate }}
    </h2>

    <p>
        {{ ('events.' + event().id + '.description') | translate }}
    </p>

    <span class="cta">
        {{ 'common.letsStart' | translate }} →
    </span>

</div>
