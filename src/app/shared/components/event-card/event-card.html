<div class="event-card" 
  (click)="selectEvent()"
  (keydown.enter)="selectEvent()"
  tabindex="0"
  role="button">

    <span class="material-symbols-outlined icon">
        {{ event().icon }}
    </span>

    <h2>
        {{ event().name }}
    </h2>

    <p>
        {{ event().description }}
    </p>

    <span class="cta">
        {{ 'common.letsStart' | translate }} →
    </span>

</div>
