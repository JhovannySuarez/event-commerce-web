<section class="hero">

    <span class="eyebrow">
        EVENT PLANNER
    </span>

    <h1>
        Plan your event.
    </h1>

    <p>
        Start by telling us what you're planning.

<section class="event-types">

    <div class="cards">

        @for(event of eventTypes; track event.id){

            <app-event-card
                [event]="event">
            </app-event-card>

        }

    </div>

</section>
