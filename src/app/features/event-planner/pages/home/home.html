<section class="hero">

    <span class="eyebrow">
        EVENT PLANNER
    </span>

    <h1>
        {{ 'home.title' | translate }}
    </h1>

    <p>
        {{ 'home.subtitle' | translate }}

</section>

<section class="event-types">

    <div class="cards">

        @for (event of eventTypes; track event.id) {
            <app-event-card [event]="event"></app-event-card>
        }

    </div>

</section>
